[project]
name = "samnik-fact-room-backend"
version = "0.1.0"
description = "Evidence-gated financial disclosure workflow for the Samnik Fact Room"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0.8,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "sentence-transformers>=5.1,<6",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
samnik-api = "samnik_backend.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samnik_backend"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
